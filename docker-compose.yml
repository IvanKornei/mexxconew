version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arbitrage-backend
    ports:
      - "3001:3000"
    volumes:
      - ./.env:/app/.env:ro
      - ./config.toml:/app/config.toml:ro
      - ./logs:/app/logs
    environment:
      - RUST_LOG=info
    restart: unless-stopped
    networks:
      - arbitrage-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: arbitrage-frontend
    ports:
      - "4201:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - arbitrage-net

networks:
  arbitrage-net:
    driver: bridge
