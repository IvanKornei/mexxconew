[package]
name = "arbitrage-system"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[dependencies]
# Async runtime (minimal features for HFT)
tokio = { version = "1.42", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rustls = { version = "0.23", features = ["aws-lc-rs"] }

# Web framework
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }

# Serialization (optimized for HFT)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.13"  # SIMD-accelerated JSON parsing for hot paths

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Crypto
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Async traits
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Configuration
dotenvy = "0.15"
toml = "0.8"

# Time
chrono = "0.4"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# HFT Performance optimizations
arc-swap = "1.7"  # Lock-free atomic pointer swapping for PriceState
parking_lot = "0.12"  # Faster RwLock if needed
crossbeam = "0.8"  # Lock-free channels and data structures
mimalloc = { version = "0.1", default-features = false }  # Low-latency allocator

# Financial precision
rust_decimal = "1.35"  # Fixed-point decimal for money calculations
rust_decimal_macros = "1.35"

# Fast parsing for HFT
fast-float = "0.2"  # 10x faster float parsing than std

# Rate limiting
governor = "0.6"  # Token bucket rate limiter for API calls
nonzero_ext = "0.3"

# Circuit breaker for risk management
failsafe = "1.3"

# Performance monitoring
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.bench]
inherits = "release"
